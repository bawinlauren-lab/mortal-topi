<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORTAL KOMBAT - SANTA MAX EDITION</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Impact', 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 1024px;
            height: 576px;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.4), 0 0 20px rgba(0, 0, 0, 0.9);
            border: 4px solid #333;
            background: #111;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        .player-hud {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 42%;
        }
        .player-hud.p2 {
            flex-direction: row-reverse;
        }
        .avatar-frame {
            width: 60px;
            height: 60px;
            border: 3px solid #d4af37;
            background: #111;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }
        .avatar-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .bar-container {
            flex-grow: 1;
        }
        .player-name {
            font-size: 20px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 4px;
            color: #f0e6d2;
            text-transform: uppercase;
        }
        .p2 .player-name {
            text-align: right;
        }
        .health-bar-bg {
            width: 100%;
            height: 24px;
            background: rgba(80, 0, 0, 0.8);
            border: 2px solid #555;
            position: relative;
            overflow: hidden;
        }
        .health-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(180deg, #ff3333 0%, #990000 100%);
            transition: width 0.15s ease-out;
        }
        .timer-box {
            width: 70px;
            height: 60px;
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #ffcc00;
            text-shadow: 0 0 10px #ff3300;
        }
        #banner {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 72px;
            letter-spacing: 4px;
            color: #ff0000;
            text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 0 0 20px #ff0000;
            pointer-events: none;
            z-index: 20;
            display: none;
            text-align: center;
        }
        #controls-hint {
            margin-top: 15px;
            font-family: monospace;
            color: #aaa;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }
        .key {
            background: #222;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #555;
            color: #fff;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="hud">
        <div class="player-hud p1">
            <div class="avatar-frame">
                <img id="p2-avatar-img" src="player1.jpg (2).jpg" alt="Shadow bawin Avatar" />
                <canvas id="p1-avatar-cvs" width="60" height="60"></canvas>
                
            </div>
            <div class="bar-container">
                <div class="player-name">P1: SHADOW BAWIN</div>
                <div class="health-bar-bg"><div id="p1-health" class="health-bar-fill"></div></div>
            </div>
        </div>

        <div class="timer-box" id="timer">99</div>

        <div class="player-hud p2">
            <div class="avatar-frame">
                <!-- Loads local friend.jpg directly -->
                <img id="p2-avatar-img" src="player2.jpg.jpg" alt="Santa Max Avatar" />
            </div>
            <div class="bar-container">
                <div class="player-name">P2: SANTA TOPI</div>
                <div class="health-bar-bg"><div id="p2-health" class="health-bar-fill"></div></div>
            </div>
        </div>
    </div>

    <div id="banner">FIGHT!</div>
    <canvas id="gameCanvas" width="1024" height="576"></canvas>
</div>

<div id="controls-hint">
    <strong>PLAYER 1 (Shadow bawin):</strong> <span class="key">W</span> Jump | <span class="key">A</span>/<span class="key">D</span> Move | <span class="key">S</span> Crouch | <span class="key">F</span> Punch | <span class="key">G</span> Kick | <span class="key">H</span> Fireball | <span class="key">R</span> Block<br>
    <strong>PLAYER 2 (Santa topi):</strong> <span class="key">↑</span> Jump | <span class="key">←</span>/<span class="key">→</span> Move | <span class="key">↓</span> Crouch | <span class="key">J</span> Punch | <span class="key">K</span> Kick | <span class="key">L</span> Present Projectile | <span class="key">O</span> Block
</div>

<script>
// Load friend photo for canvas mapping
const p2FaceImg = new Image();
p2FaceImg.src = "friend.jpg";

// Web Audio API Synthesizer
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
    } else if (type === 'kick') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(20, now + 0.18);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
    } else if (type === 'fireball') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    } else if (type === 'fatality') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(80, now);
        osc.frequency.linearRampToValueAtTime(30, now + 1.2);
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 1.2);
        osc.start(now);
        osc.stop(now + 1.2);
    }
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// Render P1 Avatar Graphic
const p1AvCvs = document.getElementById('p1-avatar-cvs');
const p1AvCtx = p1AvCvs.getContext('2d');
p1AvCtx.fillStyle = '#1a1a1a';
p1AvCtx.fillRect(0, 0, 60, 60);
p1AvCtx.fillStyle = '#ffaa00';
p1AvCtx.beginPath();
p1AvCtx.arc(30, 25, 18, 0, Math.PI * 2);
p1AvCtx.fill();
p1AvCtx.fillStyle = '#000';
p1AvCtx.fillRect(18, 20, 24, 8);

let particles = [];
function addBlood(x, y, count = 15) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.7) * 8,
            radius: Math.random() * 4 + 2,
            color: '#cc0000',
            life: 30
        });
    }
}

class Fighter {
    constructor(x, color, name, isP2 = false) {
        this.x = x;
        this.y = 360;
        this.width = 60;
        this.height = 140;
        this.vx = 0;
        this.vy = 0;
        this.color = color;
        this.name = name;
        this.isP2 = isP2;
        this.health = 100;
        this.isGrounded = true;
        this.isBlocking = false;
        this.isAttacking = false;
        this.attackType = null;
        this.attackTimer = 0;
        this.facing = isP2 ? -1 : 1;
        this.projectiles = [];
    }

    update(opponent) {
        if (!this.isGrounded) {
            this.vy += 0.8;
            this.y += this.vy;
            if (this.y >= 360) {
                this.y = 360;
                this.vy = 0;
                this.isGrounded = true;
            }
        }

        this.x += this.vx;
        if (this.x < 30) this.x = 30;
        if (this.x > canvas.width - 90) this.x = canvas.width - 90;

        if (!this.isAttacking) {
            this.facing = this.x < opponent.x ? 1 : -1;
        }

        if (this.isAttacking) {
            this.attackTimer--;
            if (this.attackTimer <= 0) {
                this.isAttacking = false;
                this.attackType = null;
            }
        }

        this.projectiles.forEach((p, idx) => {
            p.x += p.vx;
            if (Math.abs(p.x - opponent.x) < 40 && Math.abs(p.y - opponent.y) < 70) {
                opponent.takeDamage(12);
                addBlood(p.x, p.y, 20);
                this.projectiles.splice(idx, 1);
            } else if (p.x < 0 || p.x > canvas.width) {
                this.projectiles.splice(idx, 1);
            }
        });
    }

    attack(type, opponent) {
        if (this.isAttacking) return;
        this.isAttacking = true;
        this.attackType = type;
        this.attackTimer = 18;

        if (type === 'punch') {
            playSound('hit');
            if (this.getHitboxDistance(opponent) < 75) {
                opponent.takeDamage(this.isBlocking ? 2 : 8);
                addBlood(opponent.x + 30, opponent.y + 30, 8);
            }
        } else if (type === 'kick') {
            playSound('kick');
            if (this.getHitboxDistance(opponent) < 90) {
                opponent.takeDamage(this.isBlocking ? 3 : 14);
                addBlood(opponent.x + 30, opponent.y + 50, 12);
            }
        } else if (type === 'special') {
            playSound('fireball');
            this.projectiles.push({
                x: this.x + (this.facing > 0 ? 60 : -10),
                y: this.y + 40,
                vx: this.facing * 10
            });
        }
    }

    takeDamage(amount) {
        if (this.isBlocking) amount *= 0.2;
        this.health = Math.max(0, this.health - amount);
    }

    getHitboxDistance(opponent) {
        return Math.abs((this.x + 30) - (opponent.x + 30));
    }

    draw() {
        ctx.save();

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(this.x + 30, 500, 35, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        // Body Rig
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x + 10, this.y + 70, 16, 70);
        ctx.fillRect(this.x + 34, this.y + 70, 16, 70);
        ctx.fillRect(this.x + 8, this.y + 35, 44, 40);

        ctx.fillStyle = '#e0ac69';
        if (this.isAttacking && this.attackType === 'punch') {
            const armX = this.facing > 0 ? this.x + 45 : this.x - 25;
            ctx.fillRect(armX, this.y + 38, 35, 12);
        } else if (this.isAttacking && this.attackType === 'kick') {
            const legX = this.facing > 0 ? this.x + 40 : this.x - 30;
            ctx.fillRect(legX, this.y + 65, 45, 16);
        }

        // Head
        if (this.isP2 && p2FaceImg.complete && p2FaceImg.naturalWidth !== 0) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(this.x + 30, this.y + 15, 24, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(p2FaceImg, this.x - 5, this.y - 12, 70, 70);
            ctx.restore();
            // Santa Hat Overlay
            ctx.fillStyle = '#b30000';
            ctx.beginPath();
            ctx.moveTo(this.x + 10, this.y + 2);
            ctx.lineTo(this.x + 30, this.y - 22);
            ctx.lineTo(this.x + 50, this.y + 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.fillRect(this.x + 8, this.y, 44, 6);
            ctx.beginPath();
            ctx.arc(this.x + 30, this.y - 22, 6, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath();
            ctx.arc(this.x + 30, this.y + 15, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.fillRect(this.x + 16, this.y + 10, 28, 8);
        }

        ctx.restore();

        this.projectiles.forEach(p => {
            ctx.fillStyle = this.isP2 ? '#00ffff' : '#ff5500';
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        });
    }
}

const p1 = new Fighter(200, '#222', 'Shadow');
const p2 = new Fighter(760, '#3a2518', 'Santa Max', true);

let gameTime = 99;
let isFinishHer = false;
let gameOver = false;

setInterval(() => {
    if (gameTime > 0 && !gameOver) {
        gameTime--;
        document.getElementById('timer').innerText = gameTime;
    }
}, 1000);

function processInput() {
    if (gameOver) return;

    p1.vx = 0;
    if (keys['KeyA']) p1.vx = -4;
    if (keys['KeyD']) p1.vx = 4;
    if (keys['KeyW'] && p1.isGrounded) { p1.vy = -15; p1.isGrounded = false; }
    p1.isBlocking = !!keys['KeyR'];
    if (keys['KeyF']) p1.attack('punch', p2);
    if (keys['KeyG']) p1.attack('kick', p2);
    if (keys['KeyH']) p1.attack('special', p2);

    p2.vx = 0;
    if (keys['ArrowLeft']) p2.vx = -4;
    if (keys['ArrowRight']) p2.vx = 4;
    if (keys['ArrowUp'] && p2.isGrounded) { p2.vy = -15; p2.isGrounded = false; }
    p2.isBlocking = !!keys['KeyO'];
    if (keys['KeyJ']) p2.attack('punch', p1);
    if (keys['KeyK']) p2.attack('kick', p1);
    if (keys['KeyL']) p2.attack('special', p1);
}

function drawArena() {
    ctx.fillStyle = '#111318';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#1c1f26';
    ctx.fillRect(80, 0, 90, 500);
    ctx.fillRect(850, 0, 90, 500);

    [125, 895].forEach(x => {
        ctx.fillStyle = '#ff6600';
        ctx.shadowColor = '#ff6600';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(x, 180, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    ctx.fillStyle = '#222630';
    ctx.fillRect(0, 500, canvas.width, 76);
    ctx.fillStyle = '#3a3f4d';
    ctx.fillRect(0, 496, canvas.width, 4);
}

function gameLoop() {
    processInput();
    p1.update(p2);
    p2.update(p1);

    document.getElementById('p1-health').style.width = p1.health + '%';
    document.getElementById('p2-health').style.width = p2.health + '%';

    const banner = document.getElementById('banner');
    if ((p1.health <= 0 || p2.health <= 0) && !isFinishHer && !gameOver) {
        isFinishHer = true;
        banner.innerText = 'FINISH HIM!';
        banner.style.display = 'block';
        playSound('fatality');
        setTimeout(() => {
            if (!gameOver) {
                const winner = p1.health > 0 ? 'P1 SHADOW BAWIN' : 'P2 SANTA TOPI';
                banner.innerText = winner + ' WINS!';
                gameOver = true;
            }
        }, 4000);
    }

    drawArena();
    p1.draw();
    p2.draw();

    particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        if (p.life <= 0) particles.splice(i, 1);
    });

    requestAnimationFrame(gameLoop);
}

banner.style.display = 'block';
setTimeout(() => { banner.style.display = 'none'; }, 1500);
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
